debug: false

logging:
    
  level:
    org.springframework: WARN
    br.com.wagnersoft.macedonia: INFO

server:

  port: 80

  http2:
    enabled: true

  servlet:
    context-path: /macedonia
    compression:
      enabled: true
      min-response-size: 1KB
        
  ssl:
    enabled: false
    key-store: "" #wagnerstore.p12
    key-store-password: "" #123
    #keyStoreType: PKCS12
    #keyAlias: macedonia

spring:

  application:
    name: macedonia

  profiles:
    active: dev
 
  datasource:
    url: jdbc:h2:mem:macedonia;INIT=CREATE SCHEMA IF NOT EXISTS babilonia;MODE=MySQL;DB_CLOSE_ON_EXIT=FALSE;DATABASE_TO_UPPER=false;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: 123
    hikari:
      minimum-idle: 1
      maximum-pool-size: 10
      idle-timeout: 600000       # ms (10 min)
      max-lifetime: 1800000      # ms (30 min)
      connection-timeout: 30000  # ms (30 s)
      pool-name: MacedoniaHikari
      initialization-fail-timeout: 1

  jpa:
    show-sql: true
    defer-datasource-initialization: true
    open-in-view: true
    hibernate:
      ddl-auto: create-drop
      dialect: org.hibernate.dialect.H2Dialect
    properties:
      hibernate: 
        format_sql: true

  jdbc:
    template:
      query-timeout: 30

  mvc:
    format:
      date: yyyy-MM-dd
    pathmatch:
      matching-strategy: path-pattern-parser

  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
    
  h2:
    console:
      enabled: true
