<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head th:insert = "~{index :: meta}">
</head>

<body>

<script type="text/javascript">
  document.addEventListener('DOMContentLoaded', function() {
	  formatDate('nascimentoData');
  });
</script>

  <div th:replace = "~{index :: header}"></div>

  <div class="container-fluid row">
   
    <div th:replace = "~{index :: menu}"></div>

    <div class="col-md-9 col-lg-10 ms-sm-auto p-md-4">

      <h4>Benefici&aacute;rios</h4>  

      <hr class="my-3" />

      <table class="table table-striped table-sm">

        <thead>
          <tr>
            <th scope="col">...</th>
            <th scope="col">CPF</th>
            <th scope="col">Nome</th>
            <th scope="col" class="text-center">Nascimento</th>
            <th scope="col" class="text-center">Idade</th>
            <th scope="col" class="text-center">Faixa Etária</th>
            <th scope="col">Guias</th>
          </tr>
        </thead>

        <tbody>
          <tr th:if="${allBeneficiarios.empty}">
            <td colspan="6">Sem benefici&aacute;rios</td>
          </tr>
			
          <tr th:each="ben : ${allBeneficiarios}">
            <td>
              <a th:href="@{/beneficiarios/delete(cpf=${ben.cpf})}">
                <i class="bi bi-trash" style="font-size: 1rem; color: cornflowerblue;" title="Excluir"></i>
              </a>
            </td>
            <td><a th:href="@{/beneficiarios(cpf=${ben.cpf})}" title="Editar">[[${ben.cpf}]]</a></td>
            <td><span th:text="${ben.nome}"> Nome </span></td>
            <td class="text-center"><span th:text="${#temporals.format(ben.nascimentoData, 'dd/MM/yyyy')}"> Nascimento </span></td>
            <td class="text-center"><span th:text="${ben.idade}"> Idade </span></td>
            <td class="text-center"><span th:text="${ben.faixaEtaria}"> Faixa Etaria </span></td>
            <td>
              <table>
                <tr th:each="g : ${ben.guias}">
                  <td th:text="${'Nr:' + g.guiaNr}"></td>
                  <td th:text="${' - Data: ' + g.emissaoData}"></td>
                  <td th:text="${' - Total: R$ ' + #numbers.formatDecimal(g.valorTotal,1,2,'COMMA')}"></td>
                </tr>
              </table>
            </td>
          </tr>
        </tbody>

      </table>

      <h5>Adicionar Benefici&aacute;rio</h5>

      <hr class="my-3" />

      <form action="#" th:action="@{/beneficiarios/save}" th:object="${beneficiario}" method="post">
          
        <ul th:if="${#fields.hasErrors('*')}" class="error">
          <li th:each="err : ${#fields.errors('*')}" th:text="${err}">Erros no formul&aacute;rio</li>
        </ul>

        <div class="form-group row mt-1">
          <label for="cpf" class="col-sm-1 form-label my-1">
            <strong><span th:text="#{beneficiario.cpf}">CPF</span></strong>
          </label>
          <div class="col-sm-2">
            <input type="text" th:field="*{cpf}" th:errorclass="error" maxlength="11" class="form-control"/>
          </div>
        </div>
          
        <div class="form-group row mt-1">
          <label for="nome" class="col-sm-1 form-label my-1">
            <strong><span th:text="#{beneficiario.nome}">Nome</span></strong>
          </label>
          <div class="col-sm-6">
            <input type="text" th:field="*{nome}" th:errorclass="error" maxlength="255" class="form-control"/>
          </div>
        </div>

        <div class="form-group row mt-1">
          <label for="nascimentoData" class="col-sm-1 form-label my-1">
            <strong><span th:text="#{beneficiario.nascimentoData}"><strong>Dt Nasc</strong></span></strong>
          </label>
          <div class="col-sm-2">
            <input type="text" th:field="*{nascimentoData}" th:errorclass="error" maxlength="10"  class="form-control" />
            (<span th:text="#{date.format}">DD/MM/YYYY</span>)
          </div>
        </div>
          
        <div class="submit">
          <button type="submit" class="btn btn-primary my-3" name="save" th:text="#{beneficiario.save}">Novo</button>
        </div>
                  
      </form>
      
    </div>
  
  </div>

</body>

<script src="../js/macedonia.js" th:src="@{/js/macedonia.js}" ></script>

</html>
