<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head th:insert = "~{index :: meta}">
</head>

<body>

  <div th:replace = "~{index :: header}"></div>

  <div class="container-fluid row">
   
    <div th:replace = "~{index :: menu}"></div>

    <div class="col-md-9 col-lg-10 ms-sm-auto p-md-4">

      <h4 class="shadow p-3 mb-3 bg-body-tertiary rounded">Benefici&aacute;rios</h4>  

      <hr class="my-3" />

      <table class="table table-striped table-sm">

        <thead>
          <tr>
            <th scope="col">...</th>
            <th scope="col">CPF</th>
            <th scope="col">Nome</th>
            <th scope="col" class="text-center">Nascimento</th>
            <th scope="col" class="text-center">Idade</th>
            <th scope="col" class="text-center">Faixa Etária</th>
            <th scope="col">Guias</th>
          </tr>
        </thead>

        <tbody>
          <tr th:if="${allBeneficiarios.empty}">
            <td colspan="7">Sem benefici&aacute;rios</td>
          </tr>
			
          <tr th:each="ben : ${allBeneficiarios}">
            <td>
              <a th:href="@{/beneficiarios/delete(cpf=${ben.cpf})}">
                <i class="bi bi-trash" style="font-size: 1rem; color: cornflowerblue;" title="Excluir"></i>
              </a>
            </td>
            <td><a th:href="@{/beneficiarios(cpf=${ben.cpf})}" title="Editar">[[${ben.cpf}]]</a></td>
            <td><span th:text="${ben.nome}"> Nome </span></td>
            <td class="text-center"><span th:text="${#temporals.format(ben.nascimentoData, 'dd/MM/yyyy')}"> Nascimento </span></td>
            <td class="text-center"><span th:text="${ben.idade}"> Idade </span></td>
            <td class="text-center"><span th:text="${ben.faixaEtaria}"> Faixa Etaria </span></td>
            <td>
              <table>
                <tr th:each="g : ${ben.guias}">
                  <td th:text="${'Nr:' + g.guiaNr}"></td>
                  <td th:text="${' - Data: ' + g.emissaoData}"></td>
                  <td th:text="${' - Total: R$ ' + #numbers.formatDecimal(g.valorTotal,1,2,'COMMA')}"></td>
                </tr>
              </table>
            </td>
          </tr>
        </tbody>

      </table>

      <p  class="bg-danger" th:text="${error} ?: _"></p>
      
      <h5 class="shadow-sm p-3 my-3 bg-body-tertiary rounded">Editar Benefici&aacute;rio</h5>

      <hr class="my-3" />

      <form action="#" th:action="@{/beneficiarios/save}" th:object="${beneficiario}" method="post">
          
        <div class="form-group row mt-1">
          <label for="cpf" class="col-sm-2 form-label my-1 text-end">
            <strong><span th:text="#{beneficiario.cpf}">CPF</span></strong>
          </label>
          <div class="col-sm-2">
            <input type="text" th:field="*{cpf}" th:errorclass="text-danger" maxlength="11" class="form-control"/>
          </div>
          <div class="col-sm-4">
            <small th:if="${#fields.hasErrors('cpf')}" th:errors="*{cpf}" class="text-danger">Incorrect cpf</small>
          </div>
        </div>
          
        <div class="form-group row mt-1">
          <label for="nome" class="col-sm-2 form-label my-1 text-end">
            <strong><span th:text="#{beneficiario.nome}">Nome</span></strong>
          </label>
          <div class="col-sm-6">
            <input type="text" th:field="*{nome}" th:errorclass="text-danger" maxlength="255" class="form-control"/>
          </div>
          <div class="col-sm-4">
            <small th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}" class="text-danger">Incorrect nome</small>
          </div>
        </div>

        <div class="form-group row mt-1">
          <label for="nascimentoData" class="col-sm-2 form-label my-1 text-end">
            <strong><span th:text="#{beneficiario.nascimentoData}"><strong>Data Nasc</strong></span></strong>
          </label>
          <div class="col-sm-2">
            <input type="date" th:field="*{nascimentoData}" th:errorclass="text-danger" class="form-control" />
          </div>
          <div class="col-sm-4">
            <small th:if="${#fields.hasErrors('nascimentoData')}" th:errors="*{nascimentoData}" class="text-danger">Incorrect date</small>
          </div>
        </div>
          
        <div class="submit text-center">
          <button type="submit" class="btn btn-primary my-3" th:text="#{beneficiario.save}">Salvar</button>
        </div>
                  
      </form>
      
    </div>
  
  </div>

</body>

</html>
