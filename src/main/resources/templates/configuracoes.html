<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head th:insert = "~{index :: meta}">
</head>

<body>

  <div th:replace = "~{index :: header}"></div>

  <div class="container-fluid row">
   
    <div th:replace = "~{index :: menu}"></div>

    <div class="col-md-9 col-lg-10 ms-sm-auto p-md-4">

      <div th:replace="~{list-title :: div-content(#{configuracoes.titulo})}"></div>

      <div class="row gx-2">

        <div class="col-sm-4 m-3">
          <div class="card">
            <div class="card-header text-bg-info p-3"><strong>Local</strong></div>
            <div class="card-body">
              <p class="card-text" th:text="${#locale}">LOCALE</p>
            </div>
          </div>
        </div>
          
        <div class="col-sm-4 m-3">
          <div class="card">
            <div class="card-header text-bg-info p-3"><strong>Data-hora</strong></div>
            <div class="card-body">
              <p class="card-text" th:text="${#calendars.format(#execInfo.now,'dd MMMM yyyy HH:mm:ss XXX')}">INFO</p>
            </div>
          </div>
        </div>
      
      </div>
      
      <div class="row">
        <div class="col-sm-9 m-3">
          <div class="card">
            <div class="card-header text-bg-info p-3"><strong>Vari&aacute;veis Globais</strong></div>
            <div class="card-body">
              <ul>
                <li th:text="${'UsrAuth = ' + #ctx.usrAuth}">USR</li>
                <li th:text="${'unidadeMedidaMap = ' + #ctx.unidadeMedidaMap}">UM</li>
                <li th:text="${'allUf = ' + #ctx.allUf}">UF</li>
              </ul>
            </div>
          </div>
        </div>
      </div>

      <div class="row" th:if="${emsg} != null">
        <div class="col-sm-9 m-3">
          <div class="card">
            <div class="card-header text-bg-danger p-3"><strong>Erro no Processamento</strong></div>
            <div class="card-body">
              <p class="card-text text-danger" th:utext="#{app.error(${emsg})}"></p>
            </div>
          </div>
        </div>
     </div>

    </div>
  
    </div>

  <div th:insert = "~{index :: load-js}"></div>

</body>

</html>
