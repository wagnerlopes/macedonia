<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head th:insert = "~{index :: meta}">
</head>

<body>

  <div th:replace = "~{index :: header}"></div>

  <div class="container-fluid row">
   
    <div th:replace = "~{index :: menu}"></div>

    <div class="col-md-9 col-lg-10 ms-sm-auto p-md-4">

      <div th:replace="~{titulo :: titulo(#{contrato.titulo})}"></div>

      <hr class="my-3" />

      <table class="table table-striped table-sm">

        <thead>
          <tr>
            <th scope="col">...</th>
            <th scope="col">ID</th>
            <th scope="col">Estabeleciemento</th>
            <th scope="col" class="text-center">In&iacute;cio</th>
            <th scope="col" class="text-center">T&eacute;rmino</th>
            <th scope="col" class="text-end">CH</th>
          </tr>
        </thead>

        <tbody>
          <tr th:if="${allContratos.empty}">
            <td colspan="6">Sem contratos</td>
          </tr>
			
          <tr th:each="cont : ${allContratos}">
            <td>
              <a th:href="@{/contratos/delete(id=${cont.id})}">
                <i class="bi bi-trash" style="font-size: 1rem; color: cornflowerblue;" title="Excluir"></i>
              </a>
            </td>
            <td><a th:href="@{/contratos(id=${cont.id})}" title="Editar">[[${cont.id}]]</a></td>
            <td><span th:text="${cont.ocs.descricao}"> Estabelecimento </span></td>
            <td class="text-center"><span th:text="${#temporals.format(cont.inicioData, 'dd/MM/yyyy')}"> Inicio </span></td>
            <td class="text-center"><span th:text="${#temporals.format(cont.terminoData, 'dd/MM/yyyy')}"> Termino </span></td>
            <td class="text-end" th:text="${cont.chQtd}"> CH </td>
          </tr>
        </tbody>

        <tfoot><tr><td colspan="6"><small th:text="${'Total de contratos = ' + allContratos.size}">0</small></td></tr></tfoot>

      </table>

      <h5 class="shadow-sm p-3 my-3 bg-body-tertiary rounded">Editar Contrato</h5>

      <hr class="my-3" />

      <form action="#" th:action="@{/contratos/save}" th:object="${contrato}" method="post">

        <input type="hidden" th:field="*{id}"/>
          
        <div class="form-group row mt-1">
          <label for="ocs.cnpj" class="col-sm-2 form-label my-1 text-end">
            <strong><span th:text="#{contrato.ocs}">Estabelecimento</span></strong>
          </label>
          <div class="col-sm-4">
            <select th:field="*{ocs.id}" class="form-select">
              <option selected value="">--- Selecione ---</option>
              <option th:each="e : ${allOcs}" th:value="${e.key}" th:text="${e.value}">Estabelecimento</option>
            </select>
          </div>
          <div class="col-sm-4">
            <small th:if="${#fields.hasErrors('ocs.id')}" th:errors="*{ocs.id}" class="text-danger">Erro de Estabelecimento</small>
          </div>
        </div>
          
        <div class="form-group row mt-1">
          <label for="inicioData" class="col-sm-2 form-label my-1 text-end">
            <strong><span th:text="#{contrato.inicioData}"><strong>In&iacute;cio</strong></span></strong>
          </label>
          <div class="col-sm-2">
            <input type="date" th:field="*{inicioData}" th:errorclass="text-danger" class="form-control"/>
          </div>
          <div class="col-sm-4">
            <small th:if="${#fields.hasErrors('inicioData')}" th:errors="*{inicioData}" class="text-danger">Erro de data</small>
          </div>
        </div>

        <div class="form-group row mt-1">
          <label for="terminoData" class="col-sm-2 form-label my-1 text-end">
            <strong><span th:text="#{contrato.terminoData}"><strong>T&eacute;rmino</strong></span></strong>
          </label>
          <div class="col-sm-2">
            <input type="date" th:field="*{terminoData}" th:errorclass="text-danger" class="form-control"/>
          </div>
          <div class="col-sm-4">
            <small th:if="${#fields.hasErrors('terminoData')}" th:errors="*{terminoData}" class="text-danger">Erro de data</small>
          </div>
        </div>

        <div class="form-group row mt-1">
          <label for="chValor" class="col-sm-2 form-label my-1 text-end">
            <strong><span th:text="#{contrato.chQtd}">CH</span></strong>
          </label>
          <div class="col-sm-2">
            <input type="text" th:field="*{chQtd}" th:errorclass="text-danger" class="form-control"/>
          </div>
          <div class="col-sm-4">
            <small th:if="${#fields.hasErrors('chQtd')}" th:errors="*{chQtd}" class="text-danger">Erro de CH</small>
          </div>
        </div>
          
        <hr class="border-2 border-secondary" />

        <div class="submit text-center">
          <button type="submit" class="btn btn-primary my-3" name="save" th:text="#{contrato.save}">Novo</button>
          <button type="reset" class="btn btn-secondary ms-2">Limpar</button>
        </div>
                  
      </form>
      
    </div>
  
  </div>

  <div th:insert = "~{index :: load-js}"></div>

</body>

</html>
