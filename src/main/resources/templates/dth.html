<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head th:insert = "~{index :: meta}">
</head>

<body>

  <div th:replace = "~{index :: header}"></div>

  <div class="container-fluid row">
   
    <div th:replace = "~{index :: menu}"></div>

    <div class="col-md-9 col-lg-10 ms-sm-auto p-md-4">

      <div th:replace="~{list-title :: div-content(#{dth.titulo})}"></div>

      <table class="table table-striped table-sm">

        <thead>
          <tr>
            <th scope="col">...</th>
            <th scope="col">C&oacute;digo</th>
            <th scope="col">Descri&ccedil;&atilde;o</th>
            <th scope="col">Estabelecimento</th>
            <th scope="col">Unidade de Medida</th>
            <th scope="col" class="text-end">Valor Unit&aacute;rio</th>
          </tr>
        </thead>

        <tbody>
          <tr th:if="${allDth.empty}">
            <td colspan="6">Sem Di&aacute;rias e Taxas</td>
          </tr>
			
          <tr th:each="dth : ${allDth}">
            <td>
              <form th:action="@{/dth}" method="post" class="d-inline">
                <input type="hidden" name="id" th:value="${dth.id}" />
                <button type="submit" name="delete" class="btn btn-sm">
                  <i class="bi bi-trash" style="font-size: 1rem; color: cornflowerblue;" title="Excluir"></i>
                </button>
              </form>
            </td>
            <td><a th:href="@{/dth(id=${dth.id})} + '#editar'" th:text="${T(br.com.wagnersoft.macedonia.model.Dth).formatCodigo(dth.codigo)}" title="Editar"> Codigo </a></td>
            <td><span th:text="${dth.descricao}"> Descricao </span></td>
            <td><span th:text="${dth.ocs.descricao}"> Estabelecimento </span></td>
            <td><span th:text="${tipoUmMap[dth.UnidadeMedida]}"> Unidade </span></td>
            <td class="text-end" th:text="${#numbers.formatCurrency(dth.valorUnitario)}"> Valor </td>
          </tr>
        </tbody>

        <tfoot><tr><td colspan="6"><small th:text="${'Total de di&aacute;rias e taxas = ' + allDth.size()}">0</small></td></tr></tfoot>

      </table>

      <div th:replace="~{edit-title :: div-title(#{dth.editar})}"></div>

      <form action="#" th:action="@{/dth}" th:object="${dth}" method="post">
          
        <input type="hidden" th:field="*{id}"/>

        <div class="form-group row mt-1">
          <label for="codigo" class="col-sm-2 form-label my-1 text-end">
            <strong><span th:text="#{dth.codigo}">Codigo</span></strong>
          </label>
          <div class="col-sm-2">
            <input type="text" th:field="*{codigo}" th:errorclass="text-danger" maxlength="8" class="form-control"/>
          </div>
          <div class="col-sm-4">
            <small th:if="${#fields.hasErrors('codigo')}" th:errors="*{codigo}" class="text-danger">Erro de codigo</small>
          </div>
        </div>
          
        <div class="form-group row mt-1">
          <label for="descricao" class="col-sm-2 form-label my-1 text-end">
            <strong><span th:text="#{dth.descricao}">Descricao</span></strong>
          </label>
          <div class="col-sm-6">
            <input type="text" th:field="*{descricao}" th:errorclass="text-danger" maxlength="255" class="form-control"/>
          </div>
          <div class="col-sm-4">
            <small th:if="${#fields.hasErrors('descricao')}" th:errors="*{descricao}" class="text-danger">Erro de descricao</small>
          </div>
        </div>

        <div class="form-group row mt-1">
          <label for="ocs.id" class="col-sm-2 form-label my-1 text-end">
            <strong><span th:text="#{dth.ocs}">Estabelecimento</span></strong>
          </label>
          <div class="col-sm-6">
            <select th:field="*{ocs.id}" class="form-select">
              <option selected value="">--- Selecione ---</option>
              <option th:each="e : ${allOcs}" th:value="${e.key}" th:text="${e.value}">Estabelecimento</option>
            </select>
          </div>
          <div class="col-sm-4">
            <small th:if="${#fields.hasErrors('ocs.id')}" th:errors="*{ocs.id}" class="text-danger">Erro de Estabelecimento</small>
          </div>
        </div>
         
        <div class="form-group row mt-1">
          <label for="unidadeMedida" class="col-sm-2 form-label my-1 text-end">
            <strong><span th:text="#{dth.unidadeMedida}">Unidade</span></strong>
          </label>
          <div class="col-sm-2">
            <select th:field="*{unidadeMedida}" class="form-select">
              <option selected value="">--- Selecione ---</option>
              <option th:each="um : ${allUnidadeMedida}" th:value="${um.codigo}" th:text="${um.descricao}">OCS</option>
            </select>
          </div>
          <div class="col-sm-4">
            <small th:if="${#fields.hasErrors('unidadeMedida')}" th:errors="*{unidadeMedida}" class="text-danger">Erro de unidade</small>
          </div>
        </div>

        <div class="form-group row mt-1">
          <label for="valorUnitario" class="col-sm-2 form-label my-1 text-end">
            <strong><span th:text="#{dth.valorUnitario}">Valor</span></strong>
          </label>
          <div class="col-sm-2">
            <input type="text" th:field="*{valorUnitario}" th:errorclass="text-danger" maxlength="11" class="form-control"/>
          </div>
          <div class="col-sm-4">
            <small th:if="${#fields.hasErrors('valorUnitario')}" th:errors="*{valorUnitario}" class="text-danger">Erro de valor</small>
          </div>
        </div>

        <hr class="border-2 border-secondary" />

        <div class="submit text-center">
          <button type="submit" class="btn btn-primary my-3" name="save" th:text="#{form.save}">Salvar</button>
          <button type="reset" class="btn btn-secondary ms-2" th:text="#{form.reset}">Limpar</button>
        </div>

        <ul th:if="${#fields.hasErrors('*')}" class="error">
          <li th:each="err : ${#fields.errors('*')}" th:text="${err}">Erros no formul&aacute;rio</li>
        </ul>
                  
      </form>
      
    </div>
  
  </div>

  <div th:insert = "~{index :: load-js}"></div>

</body>

</html>
