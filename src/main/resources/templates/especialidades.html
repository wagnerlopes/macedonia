<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head th:insert = "~{index :: meta}">
</head>

<body>

  <div th:replace = "~{index :: header}"></div>

  <div class="container-fluid row">
   
    <div th:replace = "~{index :: menu}"></div>

    <div class="col-md-9 col-lg-10 ms-sm-auto p-md-4">

      <div th:replace="~{list-title :: div-content(#{especialidade.titulo})}"></div>

      <table class="table table-striped table-sm">

        <thead>
          <tr>
            <th scope="col">C&oacute;digo</th>
            <th scope="col">Descri&ccedil;&atilde;o</th>
          </tr>
        </thead>

        <tbody>
          <tr th:if="${lista.empty}">
            <td colspan="2">Sem especialidades</td>
          </tr>
			
          <tr th:each="esp : ${lista}">
            <td><span th:text="${esp.codigo}"> ID </span></td>
            <td><span th:text="${esp.descricao}"> Descricao </span></td>
          </tr>
        </tbody>
        
        <tfoot><tr><td colspan="2"><small th:text="${'Total de especialidades = ' + lista.size}">0</small></td></tr></tfoot>

      </table>

    </div>
      
  </div>

  <div th:insert = "~{index :: load-js}"></div>

</body>

</html>
