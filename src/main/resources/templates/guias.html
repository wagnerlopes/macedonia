<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head th:insert = "~{index :: meta}">
</head>

<body>

  <div th:replace = "~{index :: header}"></div>

  <div class="container-fluid row">
   
    <div th:replace = "~{index :: menu}"></div>

    <div class="col-md-9 col-lg-10 ms-sm-auto p-md-4">

      <h4 class="shadow p-3 mb-3 bg-body-tertiary rounded">Guias de Encaminhamento Emitidas</h4>  

      <hr class="my-3" />

      <table class="table table-striped table-sm">

        <thead>
          <tr>
            <th scope="col">...</th>
            <th scope="col">N&uacute;mero</th>
            <th scope="col">Benefici&aacute;rio</th>
            <th scope="col">OCS</th>
            <th scope="col" class="text-center">Data</th>
            <th scope="col" class="text-center">Valor (R$)</th>
          </tr>
        </thead>

        <tbody>
          <tr th:if="${allGuias.empty}">
            <td colspan="6">Sem guias de encaminhamento</td>
          </tr>
			
          <tr th:each="guia : ${allGuias}">
            <td>
              <a th:href="@{/guias/delete(id=${guia.id})}">
                <i class="bi bi-trash" style="font-size: 1rem; color: cornflowerblue;" title="Excluir"></i>
              </a>
            </td>
            <td><a th:href="@{/guias(id=${guia.id})}" title="Editar">[[${guia.guiaNr}]]</a></td>
            <td><span th:text="${guia.beneficiario.cpf + ' - ' + guia.beneficiario.nome}"> Beneficiario </span></td>
            <td><span th:text="${guia.ocs.descricao}"> OCS </span></td>
            <td class="text-center"><span th:text="${#temporals.format(guia.emissaoData, 'dd/MM/yyyy')}"> Data </span></td>
            <td class="text-end"><span th:text="${#numbers.formatDecimal(guia.valorTotal,1,2,'COMMA')}"> Valor </span></td>
          </tr>
        </tbody>

      </table>
      
      <h5 class="shadow-sm p-3 my-3 bg-body-tertiary rounded">Editar Guia de Encaminhamento</h5>

      <hr class="my-3" />

      <form action="#" th:action="@{/guias/save}" th:object="${guia}" method="post">

        <input type="hidden" th:field="*{id}"/>
          
        <ul th:if="${#fields.hasErrors('*')}" class="error">
          <li th:each="err : ${#fields.errors('*')}" th:text="${err}">Erros no formul&aacute;rio</li>
        </ul>

        <div class="form-group row mt-1">
          <label for="guiaNr" class="col-sm-1 form-label my-1">
            <strong><span th:text="#{guia.guiaNr}">NR</span></strong>
          </label>
          <div class="col-sm-2">
            <input type="text" th:field="*{guiaNr}" th:errorclass="error" maxlength="11" class="form-control"/>
          </div>

          <label for="emissaoData" class="col-sm-1 form-label my-1">
            <strong><span th:text="#{guia.emissao}"><strong>Emissao</strong></span></strong>
          </label>
          <div class="col-sm-2">
            <input type="date" th:field="*{emissaoData}" th:errorclass="error" class="form-control"/>
          </div>

          <label for="operador" class="col-sm-1 form-label my-1">
            <strong><span th:text="#{guia.operador}">Operador</span></strong>
          </label>
          <div class="col-sm-4">
            <input type="text" th:field="*{operador}" th:errorclass="error" maxlength="30" class="form-control"/>
          </div>

          <hr class="mt-3"/>

        </div>

        <div class="form-group row mt-1">
          <label for="beneficiario" class="col-sm-2 form-label my-1">
            <strong><span th:text="#{guia.beneficiario}">Beneficiario</span></strong>
          </label>
          <div class="col-sm-8">
            <select th:field="*{beneficiario.cpf}" class="form-select">
              <option selected value="">--- Selecione ---</option>
              <option th:each="ben : ${allBeneficiario}" th:value="${ben.cpf}" th:text="${ben.nome}"> Beneficiario </option>
            </select>
          </div>
        </div>

        <div class="form-group row mt-1">
          <label for="solicitante" class="col-sm-2 form-label my-1">
            <strong><span th:text="#{guia.solicitante}">Solicitante</span></strong>
          </label>
          <div class="col-sm-8">
            <select th:field="*{solicitante.cpf}" class="form-select">
              <option selected value="">--- Selecione ---</option>
              <option th:each="prof : ${allProfissional}" th:value="${prof.cpf}" th:text="${prof.nome}"> Profissional </option>
            </select>
          </div>
        </div>

        <div class="form-group row mt-1">
          <label for="responsavel" class="col-sm-2 form-label my-1">
            <strong><span th:text="#{guia.responsavel}">Responsavel</span></strong>
          </label>
          <div class="col-sm-8">
            <select th:field="*{responsavel.cpf}" class="form-select">
              <option selected value="">--- Selecione ---</option>
              <option th:each="prof : ${allProfissional}" th:value="${prof.cpf}" th:text="${prof.nome}"> Profissional </option>
            </select>
          </div>
        </div>

        <hr class="mt-3"/>
  
        <div class="form-group row mt-1">
          <label for="ocs" class="col-sm-2 form-label my-1">
            <strong><span th:text="#{guia.ocs}">OCS</span></strong>
          </label>
          <div class="col-sm-8">
            <select th:field="*{ocs.id}" class="form-select">
              <option selected value="">--- Selecione ---</option>
              <option th:each="ocs : ${allOcs}" th:value="${ocs.id}" th:text="${ocs.descricao}"> OCS </option>
            </select>
          </div>
        </div>

        <div class="form-group row mt-1">
          <label for="valorTotal" class="col-sm-2 form-label my-1">
            <strong><span th:text="#{guia.valor}">Valor</span></strong>
          </label>
          <div class="col-sm-2">
            <input type="text" th:field="*{valorTotal}" th:errorclass="error" maxlength="11" class="form-control"/>
          </div>
        </div>

        <div class="form-group row mt-1">
          <label for="observacao" class="col-sm-2 form-label my-1">
            <strong><span th:text="#{guia.observacao}">Observacao</span></strong>
          </label>
          <div class="col-sm-8">
            <input type="text" th:field="*{observacao}" th:errorclass="error" maxlength="255" class="form-control"/>
          </div>
        </div>

        <div class="submit">
          <button type="submit" class="btn btn-primary my-3" name="save" th:text="#{guia.save}">Novo</button>
        </div>

      </form>

    </div>
  
  </div>

</body>

</html>
