<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head th:insert = "~{index :: meta}">
</head>

<body>

  <div th:replace = "~{index :: header}"></div>

  <div class="container-fluid row">
   
    <div th:replace = "~{index :: menu}"></div>

    <div class="col-md-9 col-lg-10 ms-sm-auto p-md-4">

      <h4>TISS</h4>  

      <hr class="my-3" />

      <table class="table table-striped table-sm">

        <thead>
          <tr>
            <th scope="col">C&oacute;digo</th>
            <th scope="col">Descri&ccedil;&atilde;o</th>
            <th scope="col">Acomodação</th>
            <th scope="col">Consulta</th>
            <th scope="col">Guia</th>
          </tr>
        </thead>

        <tbody>
          <tr th:if="${lista.empty}">
            <td colspan="5">Sem resgistros</td>
          </tr>
			
          <tr th:each="tiss : ${lista}">
            <td><span th:text="${tiss.codigo}"> Codigo </span></td>
            <td><span th:text="${tiss.descricao}"> Descricao </span></td>
            <td><span th:text="${tiss.tipoAcomodacao.descricao}"> Acomodação </span></td>
            <td><span th:text="${tiss.tipoConsulta.descricao}"> Consulta </span></td>
            <td><span th:text="${tiss.tipoGuiaConsulta.descricao}"> Guia </span></td>
          </tr>
        </tbody>

      </table>

    </div>
  
  </div>

</body>

</html>
